[project]
name = "codex-typesafe-threads"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "typesafe-sdk>=0.7.0",
  "tiktoken>=0.7.0",
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
codex-typesafe = "codex_typesafe.cli:main"
codex-typesafe-popup = "codex_typesafe.popup:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
